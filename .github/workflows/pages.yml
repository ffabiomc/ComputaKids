name: Publicar ComputaKids
on:
  push:
    branches: [web-publica]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar catálogo
        run: node site/tests/catalogo.mjs
      - name: Validar JavaScript
        run: find site -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - uses: actions/configure-pages@v5
      - name: Preparar publicação
        run: |
          mkdir -p public
          cp -a site/. public/
          rm -rf public/tests public/README.md
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Aguardar disponibilidade do pacote
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxc "$ARTIFACT_NAME" || true)
            if [ "$count" = 1 ]; then
              echo "Pacote disponível: $ARTIFACT_NAME"
              exit 0
            fi
            echo "Aguardando pacote ($attempt/24): encontrados $count"
            sleep 5
          done
          echo "::error::Pacote ausente ou duplicado após 120 segundos"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
