name: Publicar ComputaKids
on:
  push:
    branches: [web-publica]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar catálogo
        run: node site/tests/catalogo.mjs
      - name: Validar JavaScript
        run: find site -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - uses: actions/configure-pages@v5
      - name: Preparar publicação
        run: |
          mkdir -p public
          cp -a site/. public/
          rm -rf public/tests public/README.md
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
